# Builds the Windows release and attaches it to a GitHub release.
#
# Triggered by pushing a tag such as v0.1-preview, or run manually from the
# Actions tab. The portable build (application + bundled Qt runtime) and the
# combined source archive are produced by the project's own scripts, so CI
# exercises exactly the same path a developer would.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the archive names (e.g. v0.1-preview)'
        required: true
        default: 'v0.1-preview'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Everything comes from MSYS2 UCRT64, including Qt. Installing Qt from a
      # second source as well risks mixing a Qt built for one toolchain with a
      # compiler from another, which fails at link or run time.
      - name: Install MSYS2 UCRT64 toolchain, Qt 6 and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            coreutils
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-binutils

      - name: Resolve version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure and build
        shell: msys2 {0}
        run: |
          ./build.sh Release clean

      - name: Engine smoke test
        shell: msys2 {0}
        run: |
          ./scripts/engine-smoke.sh

      - name: Verify the build is self-contained
        shell: pwsh
        run: |
          # Resolve everything to absolute paths. A relative -FilePath combined
          # with -WorkingDirectory is resolved against the new working directory,
          # which silently points at the wrong place.
          $buildDir = (Resolve-Path 'build').Path
          $exe = Join-Path $buildDir 'CPMToolsQt6.exe'
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }

          # Sanity: the Qt runtime must have been bundled next to the binary.
          $dlls = @(Get-ChildItem $buildDir -Filter *.dll)
          Write-Host "Bundled DLLs: $($dlls.Count)"
          if ($dlls.Count -lt 10) {
              throw "Only $($dlls.Count) DLLs were bundled - windeployqt did not run."
          }
          foreach ($required in 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll',
                                 'libgcc_s_seh-1.dll', 'libstdc++-6.dll') {
              if (-not (Test-Path (Join-Path $buildDir $required))) {
                  throw "Required runtime DLL missing: $required"
              }
          }
          if (-not (Test-Path (Join-Path $buildDir 'platforms\qwindows.dll'))) {
              throw "The Qt platform plugin platforms\qwindows.dll is missing."
          }

          # Launch with only the Windows system directories on PATH, so a DLL
          # that was not bundled cannot be picked up from a toolchain folder.
          $env:PATH = 'C:\Windows\system32;C:\Windows'
          $p = Start-Process -FilePath $exe -WorkingDirectory $buildDir -PassThru
          Start-Sleep -Seconds 10

          if ($p.HasExited) {
              throw "The GUI exited early with code $($p.ExitCode) - a DLL is probably missing."
          }

          $p.Refresh()
          Write-Host "GUI started and stayed running: '$($p.MainWindowTitle)'"
          $p.Kill()
          $p.WaitForExit()

      - name: Create release archive
        shell: pwsh
        run: |
          ./package_release.ps1 -Version "${{ steps.version.outputs.tag }}"

      - name: List artefacts
        shell: pwsh
        run: Get-ChildItem CPMToolsQt6-*.zip | Format-Table Name, Length

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: CPMToolsQt6-${{ steps.version.outputs.tag }}
          path: CPMToolsQt6-*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CPMToolsQt6 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: true
          files: CPMToolsQt6-*.zip
          fail_on_unmatched_files: true
